<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Crowd Surveillance Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    background: radial-gradient(circle at top, #1c2b3a, #07090f);
    color: #ffffff;
    overflow: hidden;
}

/* ---------- LAYOUT ---------- */
.dashboard {
    display: grid;
    grid-template-rows: 70px 1fr 55px;
    height: 100vh;
}

/* ---------- HEADER ---------- */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    background: rgba(0,0,0,0.6);
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: linear-gradient(135deg, #ff512f, #dd2476);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.header h1 {
    font-size: 22px;
    letter-spacing: 1px;
}

.live {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #00ff9c;
}

.live-dot {
    width: 10px;
    height: 10px;
    background: #00ff9c;
    border-radius: 50%;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.3; }
    100% { opacity: 1; }
}

/* ---------- MAIN ---------- */
.main {
    display: grid;
    grid-template-columns: 3fr 1.4fr;
    gap: 20px;
    padding: 20px;
}

/* ---------- VIDEO ---------- */
.video-panel {
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
    position: relative;
}

.video-panel img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.15);
}

/* ---------- ALERT ---------- */
.alert-box {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 18px;
    background: rgba(255,0,0,0.85);
    border-radius: 10px;
    font-weight: bold;
    letter-spacing: 1px;
    animation: blink 1s infinite;
}

@keyframes blink {
    0% { opacity: 1; }
    50% { opacity: 0.3; }
    100% { opacity: 1; }
}

/* ---------- SIDE PANEL ---------- */
.side {
    display: grid;
    grid-template-rows: repeat(4, 1fr);
    gap: 15px;
}

.card {
    background: linear-gradient(145deg, #111822, #090d14);
    border-radius: 14px;
    padding: 18px;
    box-shadow: inset 0 0 25px rgba(0,0,0,0.9);
}

.card h3 {
    font-size: 13px;
    color: #7fbfff;
    margin-bottom: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.card p {
    font-size: 20px;
    font-weight: bold;
}

/* ---------- MINI GRAPH ---------- */
.graph {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 70px;
}

.bar {
    width: 10px;
    background: linear-gradient(to top, #ff512f, #f9d423);
    border-radius: 4px;
}

/* ---------- FOOTER ---------- */
.footer {
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: #b0bec5;
    border-top: 1px solid rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<div class="dashboard">

<!-- HEADER -->
<div class="header">
    <div class="header-left">
        <div class="logo">AI</div>
        <h1>Crowd Surveillance System</h1>
    </div>
    <div class="live">
        <div class="live-dot"></div> LIVE
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <!-- VIDEO -->
    <div class="video-panel">
        <div class="alert-box">⚠ HIGH CROWD ALERT</div>
        <img src="/video">
    </div>

    <!-- SIDE INFO -->
    <div class="side">

        <div class="card">
            <h3>AI Decision Layer</h3>
            <p>Density + Risk Analysis</p>
        </div>

        <div class="card">
            <h3>Camera Source</h3>
            <p>ESP32-CAM</p>
        </div>

        <div class="card">
            <h3>Model</h3>
            <p>YOLOv8 (Person)</p>
        </div>

        <div class="card">
            <h3>Crowd Trend</h3>
            <div class="graph">
                <div class="bar" style="height:20px"></div>
                <div class="bar" style="height:40px"></div>
                <div class="bar" style="height:55px"></div>
                <div class="bar" style="height:70px"></div>
                <div class="bar" style="height:60px"></div>
                <div class="bar" style="height:75px"></div>
            </div>
        </div>

    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    Built by <b>&nbsp;Shre Raam P J</b> • AI-powered Crowd Analytics • Amrita Vishwa Vidyapeetham
</div>

</div>

</body>
</html>
